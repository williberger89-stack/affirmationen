<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Affirmationen">
<meta name="theme-color" content="#f2f2f7">
<title>Affirmationen</title>
<style>
:root{--bg:#f2f2f7;--card:#fff;--text:#000;--sub:#8e8e93;--line:#d1d1d6;--acc:#5457e6;--seg:#e3e3e8}
@media(prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--text:#fff;--sub:#8e8e93;--line:#38383a;--acc:#7a7dff;--seg:#2c2c2e}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;padding-bottom:110px}
main{max-width:560px;margin:0 auto;padding:0 16px}
h1{font-size:30px;font-weight:700;margin:calc(env(safe-area-inset-top) + 16px) 0 4px;letter-spacing:-.4px}
h2{font-size:13px;font-weight:400;text-transform:uppercase;color:var(--sub);margin:16px 16px 6px}
.card{background:var(--card);border-radius:12px;overflow:hidden}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chip{display:flex;align-items:center;gap:8px;padding:10px 12px;border:0;border-radius:12px;background:var(--card);color:var(--text);font:inherit;font-size:15px;font-weight:500;text-align:left;cursor:pointer}
.chip.on{background:var(--acc);color:#fff}
.chip span:first-child{font-size:18px}
.seg{display:flex;background:var(--seg);border-radius:9px;padding:2px;gap:2px}
.seg button{flex:1;border:0;background:none;color:var(--text);font:inherit;font-size:14px;padding:9px 0;border-radius:7px;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--card);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.15)}
textarea{width:100%;border:0;background:var(--card);color:var(--text);font:inherit;padding:12px 16px;min-height:56px;resize:vertical;outline:none;display:block}
select{width:100%;border:0;background:var(--card);color:var(--text);font:inherit;padding:12px 16px;outline:none;-webkit-appearance:none;appearance:none}
.hint{font-size:13px;color:var(--sub);margin:6px 16px 0}
.zeile{display:flex;align-items:center;justify-content:space-between;padding:11px 16px;gap:12px}
.zeile small{display:block;color:var(--sub);font-size:13px}
.sw{-webkit-appearance:none;appearance:none;width:51px;height:31px;border-radius:16px;background:var(--seg);position:relative;transition:background .2s;flex:none;margin:0;cursor:pointer}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.3);transition:transform .2s}
.sw:checked{background:#34c759}
.sw:checked::after{transform:translateX(20px)}
.start{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(env(safe-area-inset-bottom) + 12px);background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.start button{display:block;width:100%;max-width:560px;margin:0 auto;border:0;border-radius:14px;background:var(--acc);color:#fff;font:inherit;font-size:17px;font-weight:600;padding:15px;cursor:pointer}
.start button:disabled{opacity:.4}
#spieler{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:space-between;color:#fff;padding:calc(env(safe-area-inset-top) + 24px) 32px calc(env(safe-area-inset-bottom) + 40px);transition:background 1s}
#spieler.an{display:flex}
#zeit{opacity:.7;font-variant-numeric:tabular-nums;font-size:15px;z-index:1}
#satz{font:600 30px/1.25 ui-rounded,-apple-system,sans-serif;text-align:center;transition:opacity .8s;z-index:1;min-height:3em;display:flex;align-items:center}
#kreis{position:absolute;left:50%;top:50%;width:320px;height:320px;margin:-160px;border-radius:50%;background:rgba(255,255,255,.08);animation:atmen 10s ease-in-out infinite}
@keyframes atmen{50%{transform:scale(1.4)}0%,100%{transform:scale(.8)}}
.knoepfe{display:flex;gap:48px;z-index:1}
.knoepfe button{width:72px;height:72px;border:0;border-radius:50%;background:rgba(255,255,255,.18);color:#fff;font-size:26px;cursor:pointer}
</style>
</head>
<body>
<main>
<h1>Affirmationen</h1>
<h2>Ziel</h2>
<div class="grid" id="themen"></div>
<h2>Eigene Sätze</h2>
<div class="card"><textarea id="eigene" placeholder="Ein Satz pro Zeile, z. B. Ich bin bereit für Neues."></textarea></div>
<h2>Minuten</h2>
<div class="seg" id="dauer"></div>
<h2>Klang</h2>
<div class="seg" id="klang"></div>
<div class="card" style="margin-top:10px"><div class="zeile"><label for="bin">Binaurale Töne<small>Kopfhörer</small></label><input type="checkbox" class="sw" id="bin"></div></div>
<h2>Stimme</h2>
<div class="seg" id="stimmeWahl"></div>
<div class="card" id="handyBox" style="margin-top:10px" hidden><select id="stimme"></select></div>
</main>
<div class="start"><button id="start">Starten</button></div>
<div id="spieler">
<div id="kreis"></div>
<div id="zeit"></div>
<div id="satz"></div>
<div class="knoepfe"><button id="stop" aria-label="Beenden">■</button><button id="pause" aria-label="Pause">❚❚</button></div>
</div>

        const o=osz(typ,AKKORDE[0][v]*det);stimmen.push([o,det,v]);
        const og=ctx.createGain();og.gain.value=typ==="triangle"?0.5:1;o.connect(og);og.connect(pan);
      }
    }
    let i=0;const w=setInterval(()=>{i=(i+1)%AKKORDE.length;stimmen.forEach(([o,d,v])=>o.frequency.setTargetAtTime(AKKORDE[i][v]*d,ctx.currentTime,4))},20000);
    quellen.push({stop(){clearInterval(w)}});
    if(art==="schalen"){
      const noten=[196,220,246.94,293.66,329.63,392,440];
      const schlag=()=>{
        const f=wahl(noten),t=ctx.currentTime,pan=ctx.createStereoPanner();pan.pan.value=zw(-0.5,0.5);pan.connect(bus);
        [[1,0.5,9],[2.76,0.22,5],[5.4,0.09,3]].forEach(([r,a,d])=>{
          const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=f*r;
          g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(a*0.5,t+0.03);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
          o.connect(g);g.connect(pan);o.start(t);o.stop(t+d+0.1);
        });
      };
      schlag();takt(schlag,8000,15000);
    }
  }else if(art==="regen"){
    const s=ctx.createBufferSource();s.buffer=rauschBuffer("weiss",6);s.loop=true;
    const bp=ctx.createBiquadFilter();bp.type="bandpass";bp.frequency.value=2200;bp.Q.value=0.5;
    const g=ctx.createGain();g.gain.value=0.3;s.connect(bp);bp.connect(g);g.connect(bus);s.start();quellen.push(s);
    lfo(0.07,0.05,g.gain);
    const s2=ctx.createBufferSource();s2.buffer=rauschBuffer("braun",6);s2.loop=true;
    const lp=ctx.createBiquadFilter();lp.type="lowpass";lp.frequency.value=220;const g2=ctx.createGain();g2.gain.value=0.35;
    s2.connect(lp);lp.connect(g2);g2.connect(bus);s2.start();quellen.push(s2);
    const tropfen=rauschBuffer("weiss",0.15);
    takt(()=>{
      const b=ctx.createBufferSource();b.buffer=tropfen;
      const f=ctx.createBiquadFilter();f.type="bandpass";f.frequency.value=zw(1500,6500);f.Q.value=3;
      const e=ctx.createGain(),t=ctx.currentTime;e.gain.setValueAtTime(zw(0.1,0.35),t);e.gain.exponentialRampToValueAtTime(0.0001,t+0.06);
      const p=ctx.createStereoPanner();p.pan.value=zw(-0.9,0.9);
      b.connect(f);f.connect(e);e.connect(p);p.connect(bus);b.start(t);b.stop(t+0.15);
    },60,220);
  }else if(art==="meer"){
    const s=ctx.createBufferSource();s.buffer=rauschBuffer("braun",8);s.loop=true;
    const lp=ctx.createBiquadFilter();lp.type="lowpass";lp.frequency.value=600;lfo(0.09,380,lp.frequency);lfo(0.061,160,lp.frequency);
    const g=ctx.createGain();g.gain.value=0.32;lfo(0.09,0.22,g.gain);lfo(0.061,0.1,g.gain);
    s.connect(lp);lp.connect(g);g.connect(bus);s.start();quellen.push(s);
    const s2=ctx.createBufferSource();s2.buffer=rauschBuffer("weiss",6);s2.loop=true;
    const hp=ctx.createBiquadFilter();hp.type="bandpass";hp.frequency.value=3000;hp.Q.value=0.4;
    const g2=ctx.createGain();g2.gain.value=0.04;lfo(0.09,0.035,g2.gain);
    s2.connect(hp);hp.connect(g2);g2.connect(bus);s2.start();quellen.push(s2);
  }else if(art==="tief"){
    [[55,.2],[55.2,.15],[82.41,.09],[110,.05],[164.81,.02]].forEach(([f,a])=>{
      const g=ctx.createGain();g.gain.value=a;lfo(zw(0.05,0.12),a*0.4,g.gain);osz("sine",f,g);g.connect(bus);
    });
    const s=ctx.createBufferSource();s.buffer=rauschBuffer("braun",8);s.loop=true;
    const lp=ctx.createBiquadFilter();lp.type="lowpass";lp.frequency.value=160;const g=ctx.createGain();g.gain.value=0.25;lfo(0.07,0.12,g.gain);
    s.connect(lp);lp.connect(g);g.connect(bus);s.start();quellen.push(s);
  }

  if(E.binaural){
    const m=ctx.createChannelMerger(2),g=ctx.createGain();g.gain.value=0.09;
    const l=osz("sine",140),r=osz("sine",140+beat);
    l.connect(m,0,0);r.connect(m,0,1);m.connect(g);g.connect(master);
  }
  pegel(0.8,5);
}
function pegel(ziel,tau){if(master)master.gain.setTargetAtTime(ziel,ctx.currentTime,tau/3)}
function klangStop(){quellen.forEach(q=>{try{q.stop()}catch(e){}});quellen=[];if(master){master.disconnect();master=null}}

// ---------- Sprache: natürliche Stimme (Piper) oder Handy-Stimme ----------
const pakDaten={},pufferCache={};
async function pakLaden(v){
  if(!PAK[v]||pakDaten[v])return;
  try{
    const teile=[];
    for(let i=0;;i++){const r=await fetch(v+"."+i+".bin");if(!r.ok)break;teile.push(new Uint8Array(await r.arrayBuffer()))}
    if(!teile.length)return;
    const gesamt=new Uint8Array(teile.reduce((a,t)=>a+t.length,0));let o=0;teile.forEach(t=>{gesamt.set(t,o);o+=t.length});
    pakDaten[v]=gesamt.buffer;
  }catch(e){}
}
async function clip(v,text){
  const eintrag=PAK[v]&&PAK[v][fnv(text)];
  if(!eintrag)return null;
  const key=v+fnv(text);
  if(pufferCache[key])return pufferCache[key];
  await pakLaden(v);
  if(!pakDaten[v])return null;
  try{pufferCache[key]=await ctx.decodeAudioData(pakDaten[v].slice(eintrag[0],eintrag[0]+eintrag[1]));return pufferCache[key]}catch(e){return null}
}
let aktuellerClip=null,sprechRes=null;
function sprich(t,my){
  return new Promise(async res=>{
    const nat=(E.stimme==="m"||E.stimme==="f")?await clip(E.stimme,t):null;
    if(my.stop)return res();
    sprechRes=res;
    if(nat){
      const s=ctx.createBufferSource();s.buffer=nat;s.connect(sprechBus);
      s.onended=()=>{aktuellerClip=null;res()};aktuellerClip=s;s.start();
    }else if("speechSynthesis" in window){
      const u=new SpeechSynthesisUtterance(t);u.lang="de-DE";u.rate=schlafModus()?0.8:0.88;u.pitch=0.95;
      const vs=speechSynthesis.getVoices();
      const v=vs.find(v=>v.voiceURI===E.handy)||vs.find(v=>v.lang.toLowerCase().startsWith("de"));
      if(v)u.voice=v;
      u.onend=u.onerror=()=>res();speechSynthesis.speak(u);
    }else res();
  });
}

// ---------- Sitzung (jedes Mal anders) ----------
let lauf=null;
const warte=ms=>new Promise(r=>setTimeout(r,ms));
async function sitzung(){
  const my=lauf={stop:false,pause:false,rest:E.dauer*60};
  const schlaf=schlafModus(),ende=()=>my.stop,sec=()=>my.rest;
  const tempo=zw(0.85,1.25);
  const pause=(schlaf?12:(E.dauer<=10?6:8))*tempo;
  async function w(s){for(let r=s;r>0&&!ende();r-=0.2){await warte(200);if(!my.pause){my.rest-=0.2;if(my.rest<=0)return}}}
  async function zeile(t,p){
    if(ende())return;
    $("satz").style.opacity=0;await warte(300);$("satz").textContent=t;$("satz").style.opacity=1;
    pegel(0.4,0.8);await sprich(t,my);pegel(0.8,0.8);await w(p);
  }
  pakLaden(E.stimme);
  await w(zw(4,9));
  for(const z of wahl(schlaf?TEXTE.einstiegSchlaf:TEXTE.einstieg)){if(ende())return;await zeile(z,zw(4,6.5))}
  let vorrat=[],letzter="",n=0,naechsteLuecke=Math.floor(zw(3,6)),echos=[];
  while(!ende()&&sec()>30){
    if(!vorrat.length){vorrat=mischen(saetze());if(vorrat.length>1&&vorrat[0]===letzter)vorrat.push(vorrat.shift())}
    let s=vorrat.shift();
    if(echos.length&&echos[0].in<=0){s=echos.shift().s}
    echos.forEach(e=>e.in--);
    letzter=s;
    if(Math.random()<0.22)await zeile(wahl(TEXTE.bruecke),zw(1.5,3));
    const r=Math.random(),wdh=schlaf?(r<0.5?1:2):(r<0.25?1:r<0.8?2:3);
    for(let d=0;d<wdh&&!ende()&&sec()>30;d++)await zeile(s,d<wdh-1?pause*0.65:pause*1.1);
    if(Math.random()<0.25&&sec()>120)echos.push({s,in:Math.floor(zw(3,6))});
    n++;
    if(n>=naechsteLuecke&&sec()>75){
      n=0;naechsteLuecke=Math.floor(zw(3,7));
      const a=Math.random();
      if(a<0.45){await zeile(wahl(schlaf?TEXTE.atemSchlaf:TEXTE.atem),zw(7,13))}
      else if(a<0.8){$("satz").textContent="";await w(zw(15,32))}
    }
  }
  if(ende())return;
  await zeile(wahl(schlaf?TEXTE.schlussSchlaf:TEXTE.schluss),2);
  pegel(0,8);await w(8);
  beenden();
}

// ---------- Start / Pause / Ende ----------
function stillerTon(){
  // iPhone: Web-Audio wird vom Stumm-Schalter gedämpft, solange kein Audio-Element läuft.
  try{if(navigator.audioSession)navigator.audioSession.type="playback"}catch(e){}
  try{
    if(!stillEl){
      const n=8000,b=new Uint8Array(44+n),v=new DataView(b.buffer),t=(o,s)=>[...s].forEach((c,i)=>b[o+i]=c.charCodeAt(0));
      t(0,"RIFF");v.setUint32(4,36+n,true);t(8,"WAVEfmt ");v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
      v.setUint32(24,8000,true);v.setUint32(28,8000,true);v.setUint16(32,1,true);v.setUint16(34,8,true);t(36,"data");v.setUint32(40,n,true);
      b.fill(128,44);
      stillEl=new Audio("data:audio/wav;base64,"+btoa(String.fromCharCode(...b)));stillEl.loop=true;
    }
    stillEl.play().catch(()=>{});
  }catch(e){}
}
let stillEl=null,wakeLock=null;
async function starten(){
  if(!saetze().length)return;
  // Alles Wichtige direkt im Tipp (iPhone sperrt sonst Sprache und Ton):
  stillerTon();
  if("speechSynthesis" in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(" ");u.volume=0;speechSynthesis.speak(u)}
  const erstes=E.themen[0]||"selbstvertrauen";
  $("spieler").style.background=`linear-gradient(${THEMEN[erstes].f.join(",")})`;
  $("spieler").classList.add("an");
  klangStart(E.klang,THEMEN[erstes].beat);
  try{if(navigator.wakeLock)wakeLock=await navigator.wakeLock.request("screen")}catch(e){}
  if("mediaSession"in navigator){navigator.mediaSession.metadata=new MediaMetadata({title:"Affirmationen"});navigator.mediaSession.setActionHandler("pause",pause);navigator.mediaSession.setActionHandler("play",pause)}
  const t=setInterval(()=>{if(!lauf){clearInterval(t);return}
    const s=Math.max(0,Math.ceil(lauf.rest)),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;
    $("zeit").textContent=(h?h+":"+String(m).padStart(2,"0"):m)+":"+String(x).padStart(2,"0");},500);
  sitzung();
}
function pause(){
  if(!lauf)return;
  lauf.pause=!lauf.pause;
  if(lauf.pause){try{speechSynthesis.pause()}catch(e){}ctx&&ctx.suspend()}else{try{speechSynthesis.resume()}catch(e){}ctx&&ctx.resume()}
  $("pause").textContent=lauf.pause?"▶":"❚❚";
}
function beenden(){
  if(lauf){lauf.stop=true;lauf=null}
  try{if(aktuellerClip)aktuellerClip.stop()}catch(e){}
  aktuellerClip=null;if(sprechRes){sprechRes();sprechRes=null}
  try{speechSynthesis.cancel()}catch(e){}
  klangStop();if(stillEl)stillEl.pause();
  if(ctx&&ctx.state==="suspended")ctx.resume();
  try{wakeLock&&wakeLock.release()}catch(e){}
  $("spieler").classList.remove("an");$("pause").textContent="❚❚";$("satz").textContent="";
}
$("start").onclick=starten;$("pause").onclick=pause;$("stop").onclick=beenden;
</script>
